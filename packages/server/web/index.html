<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mithila Makaranda — Vedic Astrology Platform</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23d8a944'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e8833a'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="brand">
      <div class="logo">ॐ</div>
      <div><b>Mithila Makaranda</b><span id="brand-sub">वैदिक ज्योतिष प्लेटफ़ॉर्म</span></div>
    </div>
    <div class="nav" id="nav"></div>
    <div style="padding:12px 10px; margin-top:18px;" class="faint">
      <div id="gate-chip"></div>
      <div style="margin-top:8px" id="side-note">निर्धारक (डिटरमिनिस्टिक) इंजन · LLM खगोल-गणना शून्य</div>
    </div>
  </nav>
  <header id="topbar">
    <button class="method-pill" id="global-method" title="Global calculation method">
      <span class="faint">Method</span> <b id="global-method-label">Makaranda / Mithila</b> <span class="faint">▾</span>
    </button>
    <span class="badge" id="profile-chip">Profile: makaranda-v1</span>
    <span class="badge" id="ayanamsa-chip">Ayanamsa: Makaranda</span>
    <div class="spacer"></div>
    <span class="faint" id="clock"></span>
    <button class="icon-btn" id="lang-btn" title="Switch language / भाषा बदलें">EN</button>
    <button class="icon-btn" id="theme-btn" title="Toggle theme">◐</button>
  </header>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
